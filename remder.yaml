services:
  - type: web
    name: ocr-api
    env: docker
    plan: free
    repo: https://github.com/makitttt/OCR-API
    branch: main
    buildCommand: ""       # Empty because Dockerfile handles build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
